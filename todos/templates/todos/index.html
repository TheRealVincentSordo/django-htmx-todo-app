<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HTMX Todo</title>

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>


  <style>
    /* Custom styles */
  </style>
</head>

<body class="bg-[#FAFAFA] min-h-screen flex items-center justify-center py-10 px-4 font-sans text-gray-800">

  <div class="w-full max-w-xl">
    <!-- Header Section -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold mb-2 tracking-tight text-[#1a1a1a]">Today's Tasks</h1>

      <!-- Stats and Progress Bar Container -->
      <!-- We use an ID here to target it with OOB swaps from the list response -->
      <div id="stats-container">
        <div class="flex items-center justify-center gap-2 text-gray-400 mb-6">
          <!-- Check Icon -->
          <i data-lucide="check-circle-2" class="w-5 h-5"></i>
          <span class="text-lg font-medium">{{ completed }} of {{ total }} completed</span>
        </div>

        <!-- Progress Bar -->
        <div class="h-2 w-full bg-gray-200 rounded-full overflow-hidden mb-10">
          <div class="h-full bg-[#f87171] transition-all duration-500 ease-out"
            style="width: {{ percent|default:0 }}%;"></div>
        </div>
      </div>
    </div>

    <!-- Add Todo Form -->
    <form hx-post="{% url 'todos:add' %}" hx-target="#todo-list" hx-swap="innerHTML" hx-on::after-request="this.reset()"
      class="mb-6 group">
      {% csrf_token %}
      <div class="relative">
        <input name="text" type="text" placeholder="Add a new task..." autocomplete="off"
          class="w-full p-5 pr-16 rounded-2xl border-none shadow-[0_2px_8px_rgba(0,0,0,0.04)] focus:ring-0 focus:outline-none placeholder-gray-400 text-lg transition-shadow group-hover:shadow-[0_4px_12px_rgba(0,0,0,0.06)]" />
        <button type="submit"
          class="absolute right-3 top-1/2 -translate-y-1/2 bg-[#f4baba] hover:bg-[#f2a6a6] text-white p-2 rounded-xl transition-colors">
          <i data-lucide="plus" class="w-6 h-6"></i>
        </button>
      </div>
      <div class="mt-2 flex items-center gap-2 text-sm text-gray-500">
        <label for="due_date">Due date:</label>
        <input id="due_date" name="due_date" type="datetime-local"
          class="bg-transparent border-none focus:ring-0 p-0" />
      </div>
    </form>

    <!-- Todo List -->
    <div id="todo-list" class="space-y-3">
      {% include "todos/_todo_list.html" %}
    </div>
  </div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();

    // Re-initialize icons after HTMX swaps
    document.body.addEventListener('htmx:afterSwap', function (evt) {
      lucide.createIcons();
    });

    // Countdown Timer Logic
    function updateCountdowns() {
      const now = new Date();
      document.querySelectorAll('[data-countdown]').forEach(el => {
        const dueStr = el.getAttribute('data-countdown');
        if (!dueStr) return;

        const due = new Date(dueStr);
        const diff = due - now;

        if (diff <= 0) {
          el.textContent = "Overdue";
          el.classList.add("text-red-500");
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        let text = "";
        if (days > 0) text += `${days}d `;
        if (hours > 0) text += `${hours}h `;
        if (minutes > 0) text += `${minutes}m `;
        text += `${seconds}s`;

        el.textContent = text;
      });
    }

    setInterval(updateCountdowns, 1000);
    updateCountdowns(); // Initial call
  </script>
</body>

</html>
