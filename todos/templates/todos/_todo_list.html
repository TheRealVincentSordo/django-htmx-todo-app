<ul>
  {% for t in todos %}
    <li>
      <form
        hx-post="{% url 'todos:toggle' t.id %}"
        hx-target="#todo-list"
        hx-swap="innerHTML"
      >
        {% csrf_token %}
        <input type="checkbox" {% if t.done %}checked{% endif %} onchange="this.form.requestSubmit()" />
      </form>

      <span class="{% if t.done %}done{% endif %}">{{ t.text }}</span>

      <span class="spacer"></span>

      <span class="pill">{% if t.done %}done{% else %}open{% endif %}</span>

      <form
        hx-post="{% url 'todos:delete' t.id %}"
        hx-target="#todo-list"
        hx-swap="innerHTML"
      >
        {% csrf_token %}
        <button type="submit">Delete</button>
      </form>
    </li>
  {% empty %}
    <li>No todos yet.</li>
  {% endfor %}
</ul>
