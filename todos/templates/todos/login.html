<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · HTMX Todo</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 40px; max-width: 480px; }
      form { display: grid; gap: 12px; }
      label { font-size: 14px; font-weight: 600; }
      input { padding: 10px; font-size: 14px; }
      button { padding: 10px 14px; cursor: pointer; }
      .card { border: 1px solid #ddd; border-radius: 12px; padding: 24px; }
      .error { background: #fff2f2; border: 1px solid #f5c2c2; color: #a40e0e; padding: 10px 12px; border-radius: 8px; }
    </style>
  </head>

  <body>
    <h1>Sign in</h1>
    <p>Use your Supabase account to access your todos.</p>

    <div class="card">
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit">Sign in</button>
      </form>
    </div>
  </body>
</html>
